<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LABY 개발 화면 재현</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0..1,0&display=block">
<style>
/* 개발 중인 실제 에디터 화면을 캡처 기준으로 재현한 페이지.
   design.md(목업용 laby-GUI 토큰) 대신 개발 화면에서 뽑은 색·치수를 쓴다.
   디자인 보완안(DR-xx)은 body 클래스(dr03 …)로 켜고 끈다. */
:root{
  --bg:#141519; --bg-2:#1B1C21; --bg-in:#0F1013; --bd:#2A2C33; --bd-2:#24262C;
  --tx:#E6E6EA; --tx-2:#B4B6BE; --tx-3:#82838E; --tx-4:#5A5D66;
  --cy:#4CC3E8; --cy-bd:#23414C; --cy-bg:#161B1E; --cy-row:#1A2A30;
  --or:#F08C2A; --or-ink:#F59F45; --or-bg:#3E2D23;
  --off:#3A3C44; --hat1:#2C2E35; --hat2:#24262C; --tick:#4A4D55; --ok:#4CD27A;
  --tip-bg:#F5F5F5; --tip-tx:#141519;
  --dr:#9575CD; --dr-bg:#221D2E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Pretendard,"Pretendard Variable",-apple-system,"Noto Sans KR",sans-serif;font-size:13px;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ic{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;display:inline-block;vertical-align:middle;
  letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"opsz" 20}
.ic.f{font-variation-settings:"FILL" 1,"wght" 400,"opsz" 20}
body{display:flex;flex-direction:column}

/* ── 검토용 바 (실제 화면에는 없음) ── */
#drbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:6px 16px;background:var(--dr-bg);border-bottom:1px dashed var(--dr);font-size:12px;color:var(--tx-2);flex-wrap:wrap}
#drbar b{color:var(--tx)}
#drbar .seg2{display:flex;background:var(--bg-in);border:1px solid var(--bd);border-radius:6px;padding:2px}
#drbar .seg2 button{padding:3px 10px;border-radius:4px;color:var(--tx-3)}
#drbar .seg2 button.on{background:var(--dr);color:#fff;font-weight:600}
#drbar .items{display:flex;gap:10px;flex-wrap:wrap}
#drbar label{display:flex;align-items:center;gap:4px;cursor:pointer}
#drbar label.dis{opacity:.4;pointer-events:none}
#drbar a{color:#B39DDB;text-decoration:none;margin-left:auto}
#drbar a+a{margin-left:0}
#drbar a:hover{text-decoration:underline}

/* ── 앱 레이아웃 ── */
#app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
.right{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--bd-2);background:var(--bg)}

.hd{flex:0 0 46px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--bd-2)}
.logo{display:flex;align-items:center;gap:4px}
.logo i{width:18px;height:18px;border-radius:50%;background:var(--or);position:relative}
.logo i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg);border:2px solid #FFC56B}
.logo span{display:flex;flex-direction:column;line-height:1}
.logo b{color:var(--or);font-size:15px;font-weight:800;letter-spacing:-.3px}
.logo small{color:var(--or);font-size:5px;letter-spacing:2px;font-weight:700;margin-top:1px}
.hd .sep{width:1px;height:18px;background:var(--bd)}
.hd .ttl{font-weight:700;font-size:14px}
.hd .sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg-2);font-size:12px;font-weight:600}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pill .ic{font-size:16px;color:var(--tx-3)}
.help{display:flex;align-items:center;gap:4px;color:var(--tx-2);font-size:12px}

.stage{flex:1;min-height:160px;position:relative;background:#000;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ch1{position:absolute;left:16px;top:12px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#fff;z-index:2}
.ch1 .ic{font-size:14px;color:var(--cy)}
.pv{position:absolute;left:16px;top:12px;display:none;align-items:center;gap:12px;z-index:3}
.pv .b{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;background:var(--or);color:#1B1C21;font-weight:700;font-size:12px}
.pv .b i{width:6px;height:6px;border-radius:50%;background:#1B1C21}
.pv .n{font-weight:700;font-size:12px}
body.edit .pv{display:flex}
body.edit .ch1{top:52px}
.sub{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);max-width:78%;text-align:center;font-size:15px;font-weight:600;line-height:1.55;color:#fff;
  text-shadow:0 0 3px #000,0 1px 2px #000;z-index:2;pointer-events:none}

/* 컨트롤 + 타임라인 */
.ctl{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--bd-2);padding:8px 16px 12px}
.r1{display:flex;align-items:center;gap:14px;height:40px}
.r1 .ib{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#fff}
.r1 .ib .ic{font-size:22px}
.r1 .ib:disabled{color:var(--tx-4);cursor:default}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:68px;accent-color:#fff;height:4px}
.tm{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm .g{color:var(--tx-3);font-weight:400}
.tm .lb{color:var(--or);font-weight:700;margin-right:4px}
.r1 .sp{flex:1}
.cut{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg-2);font-weight:700}
.cut .ic{font-size:18px}
.spd{font-weight:700;width:32px;text-align:right}
.r2{display:flex;align-items:center;gap:12px;margin:6px 0 8px}
.sg{display:flex;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg-in)}
.sg button{height:26px;padding:0 10px;border-radius:6px;color:var(--tx-3);font-size:12px}
.sg button.on{background:var(--bd);color:var(--tx);font-weight:700}
.sg .ic{font-size:16px;color:var(--tx-3);padding:0 4px 0 6px;align-self:center}
.hint{margin-left:auto;font-size:11px;color:var(--tx-3)}

.tl{position:relative;overflow:hidden;user-select:none}
.ru{position:relative;height:16px}
.ru span{position:absolute;top:0;height:14px;padding-left:4px;border-left:1px solid var(--bd);font-size:10px;color:var(--tx-3);line-height:12px;white-space:nowrap}
.chs{position:relative;height:14px}
.ch{position:absolute;top:2px;width:9px;margin-left:-4px;height:10px;cursor:pointer;z-index:2}
.ch i{position:absolute;left:4px;top:0;width:1px;height:10px;background:var(--tick)}
.ch.cur i{background:var(--or)}
/* DR-03 슬라이드 줄: 목차를 세로선 대신 블록+제목으로. 켜면 위의 목차 라인 줄을 대신함 */
.slt{position:relative;height:22px;margin-top:8px;display:none}
body.dr03 .chs{display:none}
body.dr03 .slt{display:block}
.sb{position:absolute;top:0;bottom:0;border-radius:2px;background:#1F2026;cursor:pointer;overflow:hidden;
  font-size:11px;line-height:22px;padding:0 6px;color:var(--tx-2);white-space:nowrap;text-overflow:ellipsis}
.sb.b{background:#26272D}
.sb.nt{font-style:italic;color:var(--tx-4)}
.sb:hover{background:#3A3C44;color:var(--tx)}
.sb.cur{color:var(--tx)}
.sb.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--or)}
#drbar label .dt{padding:0 4px;border-radius:3px;background:var(--dr);color:#fff;font-size:10px;font-weight:700}
#drbar label .dt.rp{background:var(--bd);color:var(--tx-3)}
#aiCol{display:none;align-items:center;gap:6px}
body.dr05 #aiCol{display:flex}

/* DR-04·05 (시안) 공통: 구간 목록이 "모든 편집의 결과"임을 보여 줌 */
.sld{display:none;margin:-4px 16px 8px;font-size:11px;color:var(--tx-3)}
body.dr04 .sld,body.dr05 .sld{display:block}
.meb{display:none;flex:0 0 auto;align-items:center;gap:2px;padding:1px 4px;border-radius:3px;background:var(--bd);color:var(--tx-2);font-size:10px;font-weight:800}
.meb .ic{font-size:11px}
body.dr04 .meb,body.dr05 .meb{display:inline-flex}
body.dr04 .aib.x,body.dr05 .aib.x{display:none}
@keyframes nw{from{background:rgba(76,195,232,.22)}to{background:transparent}}
body.dr04 .row.nw,body.dr05 .row.nw{animation:nw 1.6s ease-out}
/* DR-04 (시안) 지금 배치 유지: AI 영역 배경 한 단계 + 목록 앞 구분선 진하게 */
body.dr04:not(.dr05) .ai{background:#18191E}
body.dr04:not(.dr05) .sl{border-top:1px solid #34363E}
/* DR-05 (시안) 구간 목록 탭 독립 + AI 입력을 패널 아래 색 구역으로 고정 */
.dock{display:none}
.ai-x,.ai-last{display:none}
body.dr05{--az-bg:#241A12;--az-bd:#5A3A1E;--az-ic:#F59F45}
body.dr05.aiblue{--az-bg:#13222A;--az-bd:#23515F;--az-ic:#4CC3E8}
body.dr05 .dock{display:block;flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid var(--bd-2)}
body.dr05 .dock .ai{padding:12px;border-radius:12px;background:var(--az-bg);border:1px solid var(--az-bd)}
body.dr05 .dock .ai-h{margin-bottom:8px}
body.dr05 .dock .ai-h .ic{color:var(--az-ic)}
body.dr05 .dock .log{display:none}
body.dr05 .dock .ai.open .log{display:block;max-height:240px;padding-top:4px;border-top:1px solid var(--az-bd);margin-top:4px}
body.dr05 .ai-x{display:flex;align-items:center;gap:2px;margin-left:auto;font-size:11px;font-weight:500;color:var(--tx-3)}
body.dr05 .ai-x .ic{font-size:16px;color:var(--tx-3)!important}
body.dr05 .ai-x:empty{display:none}
body.dr05 .ai-last{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--tx-2)}
body.dr05 .ai-last:empty{display:none}
.ai-last .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-last .q b{color:var(--tx)}
.ai-last button{flex:0 0 auto;height:24px;padding:0 8px;border-radius:6px;font-size:11px;border:1px solid var(--bd);background:var(--bg)}
.ai-last .pri{background:var(--cy);border-color:var(--cy);color:#0F1013;font-weight:600}
/* DR-05: 구간 목록이 아닌 탭에서는 입력창 한 줄로 접고, 입력창을 누르면 펼침 */
.ai-last .gl{display:none}
body.dr05:not([data-tab="edit"]) .ai-last .gl{display:inline-block}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus){padding:8px}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .ai-h,
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .ai-last,
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .log,
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .chips,
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .inp .f span{display:none}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .inp{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .inp::before{content:"add";font-family:"Material Symbols Outlined";font-size:16px;color:var(--az-ic)}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .inp textarea{flex:1;height:22px;line-height:22px;overflow:hidden;white-space:nowrap}
/* 접힌 상태: 보내기 대신 위로 펼치기 버튼 / 펼친 상태: 머리줄 오른쪽에 접기 버튼 */
.inp .go.ai-open,.ai-h .ai-fold{display:none}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) #bGo{display:none}
body.dr05:not([data-tab="edit"]) .dock .ai:not(.focus) .ai-open{display:flex;background:var(--az-bd);color:var(--az-ic)}
body.dr05:not([data-tab="edit"]) .dock .ai.focus .ai-fold{display:flex;align-items:center;gap:2px;height:22px;padding:0 8px 0 4px;margin-left:8px;border:1px solid var(--az-bd);border-radius:11px;font-size:11px;color:var(--tx-2)}
body.dr05:not([data-tab="edit"]) .dock .ai.focus .ai-fold .ic{font-size:16px;color:var(--tx-2)!important}
body.dr05:not([data-tab="edit"]) .dock .ai.focus .ai-fold:hover{color:var(--tx);border-color:var(--az-ic)}
body.dr05:not([data-tab="edit"]) .dock .ai.focus .ai-x{margin-left:auto}
body.dr05:not([data-tab="edit"]) .dock .ai.focus .ai-x:empty+.ai-fold{margin-left:auto}

.pg{position:relative;height:16px;margin-top:4px;cursor:pointer}
.pg .tr{position:absolute;left:0;right:0;top:5px;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.pg .ht{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--hat1) 0 4px,var(--bg) 4px 8px)}
.pg .fl{position:absolute;left:0;top:0;bottom:0;background:var(--or)}
.pg .kn{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--or);z-index:2}
.bk{position:relative;height:28px;margin-top:6px}
.blk{position:absolute;top:0;bottom:0;cursor:pointer}
.blk.on{background:var(--cy);border-radius:2px}
.blk.off{background:repeating-linear-gradient(-45deg,var(--hat1) 0 6px,var(--hat2) 6px 12px)}
body.edit .blk.off{cursor:not-allowed}
.bd{position:absolute;top:-2px;bottom:-2px;width:9px;margin-left:-4px;z-index:3}
.bd i{position:absolute;left:3px;top:0;bottom:0;width:2px;background:#fff;border-radius:1px}
.bd.dr{cursor:ew-resize}
.mgs{position:relative;height:22px}
.mg{position:absolute;top:4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:1px solid #36373F;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--tx-2)}
.mg .ic{font-size:12px;transform:rotate(90deg)}
.mg:hover{border-color:var(--cy);color:var(--cy)}
.ph{position:absolute;width:1px;background:var(--or);pointer-events:none;z-index:2}
.tip{position:absolute;top:-2px;transform:translate(-50%,-100%);padding:5px 10px;border-radius:6px;background:var(--tip-bg);color:var(--tip-tx);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;display:none;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tlw{position:relative}

/* 오른쪽 패널 */
.ph2{flex:0 0 46px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:1px solid var(--bd-2)}
.ph2 .t{flex:1;min-width:0}
.ph2 b{display:block;font-size:14px}
.ph2 small{display:block;font-size:11px;color:var(--tx-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apply{height:32px;padding:0 16px;border-radius:6px;background:var(--or);color:#1B1C21;font-weight:700}
.apply:disabled{background:var(--bd-2);color:var(--tx-4);cursor:default}
.tabs{flex:0 0 40px;display:flex;border-bottom:1px solid var(--bd-2)}
.tabs button{flex:1;color:var(--tx-2);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);font-weight:700;border-bottom-color:var(--or)}
.pane{flex:1;min-height:0;display:none;flex-direction:column}
.pane.on{display:flex}

/* 편집 목록 탭 */
.ai{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 16px 14px}
.ai-h{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:8px}
.ai-h .ic{font-size:16px;color:var(--or)}
.log{flex:0 1 auto;min-height:0;overflow:auto;margin:0 -6px 10px -2px;padding:0 6px 0 2px}
.log:empty{display:none}
.mu{display:flex;justify-content:flex-end;margin:4px 0 12px}
.mu span{max-width:85%;padding:6px 10px;border-radius:8px;background:var(--bd-2);font-weight:600;font-size:12px}
.ma{font-weight:600;line-height:1.55;margin-bottom:6px;font-size:13px}
.ma p{margin:0 0 12px}
.ma p:last-child{margin:0}
.ma.th{color:var(--tx-3);font-weight:400}
.mc{font-size:11px;color:var(--tx-3);margin:-2px 0 16px}
.card{border:1px solid var(--cy-bd);background:var(--cy-bg);border-radius:8px;padding:12px;margin:8px 0 6px}
.card .ok{display:flex;align-items:center;gap:4px;color:var(--cy);font-weight:700;font-size:12px}
.card .ok .ic{font-size:16px}
.card .st{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 0 12px}
.card .st small{display:block;font-size:10px;color:var(--tx-3)}
.card .st b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
.card .st div+div b{color:var(--tx-3);font-weight:500}
.card .bt{display:flex;gap:6px}
.card .bt button{height:30px;border-radius:6px;font-size:12px}
.card .pri{flex:1;background:var(--cy);color:#0F1013;font-weight:600}
.card .sec{padding:0 12px;border:1px solid var(--bd);background:var(--bg)}
.inp{flex:0 0 auto;border:1px solid var(--bd);border-radius:10px;background:var(--bg-in);padding:12px 12px 8px}
.inp textarea{width:100%;height:40px;resize:none;border:0;outline:0;background:none;font-size:13px}
.inp textarea::placeholder{color:var(--tx-3)}
.inp .f{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--tx-4)}
.inp .go{width:26px;height:26px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx-3)}
.inp .go .ic{font-size:16px}
.inp:focus-within{border-color:#3A3C44}
.chips{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{height:26px;padding:0 10px;border:1px solid #2C2E34;border-radius:13px;background:#16171C;font-size:12px;color:#D6D6DC}
.chip:hover{border-color:#3A3C44;color:#fff}
.sl{flex:1 0 240px;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--bd-2)}
.sl-h{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sl-h b{font-size:13px}
.sl-h small{font-size:11px;color:var(--tx-3)}
.sl-l{flex:1;min-height:0;overflow:auto}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px 9px;border-bottom:1px solid var(--bd-2)}
.row.cur{background:var(--bg-2)}
.row .ix{width:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--tx-4)}
.row .ix i{width:10px;height:10px;border-radius:2px;background:var(--off)}
.row.on .ix i{background:var(--cy)}
.row .mn{flex:1;min-width:0;cursor:pointer}
.row .tt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.row.off .tt{color:var(--tx-3);font-weight:500}
.row .s2{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden}
.row .s2 span{overflow:hidden;text-overflow:ellipsis}

<script>
(function(){
var D=window.D, TOT=D.dur, $=function(s){return document.querySelector(s);};
var vid=$('#vid');

/* ── 디자인 보완안 (DESIGN-REVIEW.md의 DR 번호와 같게) ── */
var DR=[ {id:'03', t:'슬라이드 줄 (블록 + 제목)'},
  {id:'04', t:'지금 배치 + 목록 구분 (설명·출처·강조)', draft:true}, {id:'05', t:'구간 목록 탭 독립 + AI 아래 고정', draft:true} ]; // draft = 확정 전 시안(기본 꺼짐), by = 다른 항목으로 대체됨(기본 꺼짐)
var drOn=true, drSel={}; // 기본은 개선안 (?dr=none → 현재 개발 화면)
(function(){
  var q=new URLSearchParams(location.search).get('dr');
  DR.forEach(function(d){ drSel[d.id]=!d.draft&&!d.by; });
  if(q==='none') drOn=false;
  else if(q){ if(q!=='all'){ DR.forEach(function(d){ drSel[d.id]=q.split(',').indexOf(d.id)>=0; }); } }
  $('#drItems').innerHTML=DR.map(function(d){ return '<label data-id="'+d.id+'"><input type="checkbox"'+(drSel[d.id]?' checked':'')+'>'+(d.draft?'<span class="dt">시안</span>':'')+(d.by?'<span class="dt rp">대체됨 → DR-'+d.by+'</span>':'')+'<b>DR-'+d.id+'</b> '+d.t+'</label>'; }).join('');
  $('#drItems').addEventListener('change',function(e){ var l=e.target.closest('label'); drSel[l.dataset.id]=e.target.checked; applyDR(); });
  $('#drMode').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; drOn=b.dataset.v==='1'; applyDR(); });
})();
function applyDR(){
  DR.forEach(function(d){ document.body.classList.toggle('dr'+d.id, drOn&&drSel[d.id]); });
  renderSlt(); placeAI();
  [].forEach.call($('#drMode').children,function(b){ b.classList.toggle('on',(b.dataset.v==='1')===drOn); });
  [].forEach.call($('#drItems').children,function(l){ l.classList.toggle('dis',!drOn); });
}

/* ── 시간 표기 ── */
function pad(n){ return String(n).padStart(2,'0'); }
function hms(t){ t=Math.max(0,Math.floor(t+1e-6)); return pad(t/3600|0)+':'+pad((t%3600)/60|0)+':'+pad(t%60); }
function hmsd(t){ var x=Math.round(Math.max(0,t)*10); return hms(Math.floor(x/10))+'.'+(x%10); }
function ms(t){ t=Math.round(t); return (t/60|0)+':'+pad(t%60); }
function mm(t){ t=Math.round(t); return pad(t/60|0)+':'+pad(t%60); }
function kmin(t){ t=Math.round(t); var m=t/60|0, s=t%60; return (m?m+'분 ':'')+s+'초'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(function(){ t.classList.remove('on'); },1800); }

/* ── 슬라이드 제목 (OCR이 깨진 제목은 제목 없음으로) ── */
var HEADS=D.heads.map(function(h){ var ok=h.title&&h.ok&&!/[\]|“;—_]/.test(h.title); return {n:h.n,t:h.t,e:h.e,title:ok?h.title.trim():null}; });
function headAt(t){ for(var i=HEADS.length-1;i>=0;i--) if(HEADS[i].t<=t+1e-6) return i; return 0; }
function titleFor(s,e){ var b=null,bo=0; HEADS.forEach(function(h){ var o=Math.min(e,h.e)-Math.max(s,h.t); if(h.title&&o>bo){ bo=o; b=h.title; } }); return b; }

/* ── 상태: rows = 구간 목록 {s,e,m:'on'|'off',ai,ti} ── */
var rows=[{s:0,e:TOT,m:'on'}];
var undo=[], redo=[], savedAt=null, mode='all', span=0, ws=0;
function snap(){ return rows.map(function(r){ return Object.assign({},r); }); }
function recordUndo(){ undo.push(snap()); if(undo.length>100) undo.shift(); redo=[]; }
function touched(){ savedAt=new Date(); }
function onRows(){ return rows.filter(function(r){ return r.m==='on'; }); }
function onTotal(){ return onRows().reduce(function(a,r){ return a+r.e-r.s; },0); }
function rowAt(t){ for(var i=0;i<rows.length;i++) if(t<rows[i].e-1e-6||i===rows.length-1) return i; return rows.length-1; }

/* ── AI 편집안 (개발 화면 캡처의 결과 값을 그대로 씀) ── */
function snapCue(a,b){ var s=a,e=b; for(var i=0;i<D.cues.length;i++){ if(D.cues[i].t>=a){ s=D.cues[i].t-0.2; break; } }
  for(var j=D.cues.length-1;j>=0;j--){ if(D.cues[j].e<=b){ e=D.cues[j].e+0.2; break; } } return [s,e]; }
function silence(){ var cs=D.cues.slice().sort(function(a,b){ return a.t-b.t; }), sp=[];
  cs.forEach(function(c){ var l=sp[sp.length-1]; if(l&&c.t<=l[1]+3) l[1]=Math.max(l[1],c.e); else sp.push([c.t,c.e]); });
  return sp.map(function(x){ return [Math.max(0,x[0]-0.2),Math.min(TOT,x[1]+0.2)]; }); }
var PLANS=[
  {q:'앞 30초, 뒤 1분 잘라줘', d:'앞 30초와 뒤 1분을 잘라낸', on:function(){ return [[30,TOT-60]]; }},
  {q:'3초 넘는 무음 빼줘', d:null, on:silence},
  {q:'세포 손상과 비가역적 변화 설명만 남겨줘', d:'세포 손상과 비가역적 변화에 대한 설명만 남긴', on:function(){ return [[6,878.4],[959.6,1002.3],[1031.6,2459.9]]; }},
  {q:'아포프토시스와 네크로시스 구분을 3분으로 요약해줘', d:'아포프토시스와 네크로시스를 구분하는 설명을 3분 분량으로 모은', on:function(){ return [snapCue(1575,1650),snapCue(2042,2100),snapCue(2112,2160)]; }},
  {q:'염증 반응 관련 부분만 모아줘', d:'염증 반응 관련 부분만 남긴', on:function(){ return [[154,851.6],[1002,2460],[2788,3120]]; }},
  {q:'심근경색과 갱그린 necrosis 빼줘', d:'심근경색과 갱그린 괴사(necrosis) 설명을 뺀', on:function(){ return [[0,2198],[2325,2460],[2533,TOT]]; }}
];
function fromOn(ons){ var out=[],p=0;
  ons.forEach(function(o){ if(o[0]-p>0.05) out.push({s:p,e:o[0],m:'off'}); out.push({s:o[0],e:o[1],m:'on'}); p=o[1]; });
  if(TOT-p>0.05) out.push({s:p,e:TOT,m:'off'});
  out.forEach(function(r){ r.ai=true; r.ti=titleFor(r.s,r.e); }); return out; }

var cards=[]; // {q, d, base, n, tot, before, st:'on'|'rev'}
function findPlan(q){ var k=q.replace(/\s/g,'');
  for(var i=0;i<PLANS.length;i++) if(PLANS[i].q.replace(/\s/g,'')===k) return PLANS[i];
  var keys=[['무음',1],['30초',0],['비가역',2],['아포',3],['네크로',3],['염증',4],['심근',5],['갱그린',5]];
  for(var j=0;j<keys.length;j++) if(k.indexOf(keys[j][0])>=0) return PLANS[keys[j][1]];
  return null; }
function ask(q){
  q=q.trim(); if(!q) return;
  var log=$('#log'); busy=q; renderLast();
  log.insertAdjacentHTML('beforeend','<div class="mu"><span>'+esc(q)+'</span></div><div class="ma th" id="think">AI가 편집하는 중…</div>');
  log.scrollTop=log.scrollHeight;
  setTimeout(function(){
    var th=$('#think'); if(th) th.remove(); busy=null;
    var p=findPlan(q);
    if(!p){ log.insertAdjacentHTML('beforeend','<div class="ma"><p>재현 화면에서는 아래 예시 요청만 동작해요.</p></div>'); log.scrollTop=log.scrollHeight; renderLast('재현 화면에서는 예시 요청만 동작해요'); return; }
    // 새 요청은 직전 AI 변경을 되돌린 상태에서 시작
    var last=cards[cards.length-1]; recordUndo();
    if(last&&last.st==='on'){ rows=last.base.map(function(r){ return Object.assign({},r); }); last.st='rev'; }
    var base=snap(), before=onTotal();
    var ons=p.on(); rows=fromOn(ons);
    var d=p.d||('3초 넘는 무음 '+(rows.filter(function(r){ return r.m==='off'; }).length)+'곳을 뺀');
    cards.push({q:q,d:d,base:base,n:onRows().length,tot:onTotal(),before:before,st:'on'});
    touched(); renderLog(); renderAll();
  },900);
}
function renderLog(){
  var h='';

  var v=document.createElement('video'); v.muted=true; v.preload='auto'; v.src='../proxy.mp4';
  var cv=document.createElement('canvas'); cv.width=176; cv.height=100; var cx=cv.getContext('2d'), i=0;
  function next(){ if(i>=HEADS.length) return; var hd=HEADS[i]; v.currentTime=Math.min(hd.e-0.1,hd.t+Math.min(2,(hd.e-hd.t)/2)); }
  v.addEventListener('seeked',function(){ try{ cx.drawImage(v,0,0,cv.width,cv.height); var el=$('#th'+i); el.style.backgroundImage='url('+cv.toDataURL('image/jpeg',0.7)+')'; el.classList.add('ld'); }catch(e){} i++; next(); });
  v.addEventListener('loadeddata',next); v.addEventListener('error',function(){});
}

/* ── 검색 탭 (임시) ── */
$('#fq').addEventListener('input',function(){
  var q=this.value, k=q.replace(/\s/g,'').toLowerCase(), h='';
  if(!k){ $('#sr').innerHTML='<div class="empty">찾을 단어를 입력하세요</div>'; return; }
  var hs=HEADS.filter(function(hd){ return hd.title&&hd.title.replace(/\s/g,'').toLowerCase().indexOf(k)>=0; });
  if(hs.length) h+='<h4>슬라이드 '+hs.length+'</h4>'+hs.map(function(hd){ return '<div class="cu" data-t="'+hd.t+'"><span class="t">'+hms(hd.t)+'</span><span class="x">'+hl(hd.title,q)+'</span></div>'; }).join('');
  var cs=D.cues.filter(function(c){ return c.x.replace(/\s/g,'').toLowerCase().indexOf(k)>=0; });
  if(cs.length) h+='<h4>자막 '+cs.length+'</h4>'+cs.map(function(c){ return '<div class="cu'+(cueOn(c)?'':' off')+'" data-t="'+c.t+'"><span class="t">'+hms(c.t)+'</span><span class="x">'+hl(c.x,q)+'</span></div>'; }).join('');
  $('#sr').innerHTML=h||'<div class="empty">찾는 내용이 없어요</div>';
});
$('#sr').addEventListener('click',function(e){ var c=e.target.closest('.cu'); if(c) goTo(+c.dataset.t); });

/* ── 탭 ── */
$('#tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  [].forEach.call($('#tabs').children,function(x){ x.classList.toggle('on',x===b); }); document.body.dataset.tab=b.dataset.p;
  ['edit','cap','toc','find'].forEach(function(p){ $('#p-'+p).classList.toggle('on',p===b.dataset.p); });
  if(b.dataset.p==='toc'){ makeThumbs(); lastHead=-1; } if(b.dataset.p==='cap') lastCue=-1;
});

/* ── 전체 갱신 / 프레임마다 갱신 ── */
function renderAll(){
  renderTL(); renderList(); renderCap();
  var on=onRows();
  $('#sum').textContent='켜진 구간 '+on.length+'개 · '+ms(onTotal())+' / '+ms(TOT)+(savedAt?' · 임시 저장됨 · '+pad(savedAt.getHours())+':'+pad(savedAt.getMinutes()):'');
  $('#bApply').disabled=rows.length===1&&rows[0].m==='on';
  $('#bUndo').disabled=!undo.length; $('#bRedo').disabled=!redo.length;
  $('#hint').textContent=mode==='edit'?'편집 결과 재생 중 · 꺼진 구간으로는 이동할 수 없어요':rows.length===1?'재생 위치에서 자르거나 AI에게 요청하세요':'구간을 누르면 처음부터 재생 · 경계를 드래그해 조정';
  lastRow=-1;
}
var lastRow=-1, lastCue=-1, lastHead=-1, lastCh=-1;
function cueIdx(t){ var b=-1; for(var i=0;i<D.cues.length;i++){ var c=D.cues[i]; if(c.t>t) break; if(t<c.e) b=i; } return b; }
function tick(force){
  var now=performance.now(), dt=(now-lastNow)/1000; lastNow=now;
  if(sim&&simPlay){ simT+=dt*rate; if(simT>=TOT){ simT=TOT; simPlay=false; } }
  var t=T();
  if(mode==='edit'&&playing()){ var ri=rowAt(t); if(rows[ri].m==='off'||t>=rows[ri].e-0.05&&ri===rows.length-1){ if(!jumpNextOn(ri)) pause(); t=T(); } }
  if(span&&fixWin()) { renderTL(); return; }
  var x=X(t), vis=x>=0&&x<=100;
  $('#fl').style.width=Math.max(0,Math.min(100,x))+'%';
  var kn=$('#kn'); kn.style.left=x+'%'; kn.style.display=vis?'':'none';
  var ph=$('#ph'), pg=$('#pg'), bk=$('#bk'); ph.style.left=x+'%'; ph.style.display=vis?'':'none'; ph.style.top=(pg.offsetTop+8)+'px'; ph.style.height=(bk.offsetTop+bk.offsetHeight-pg.offsetTop-8)+'px';
  $('#bPlay').firstChild.textContent=playing()?'pause':'play_arrow';
  if(mode==='edit'){ var acc=0, cur=0, on=onRows(), k=0; for(var i=0;i<on.length;i++){ if(t>=on[i].e){ acc+=on[i].e-on[i].s; } else { if(t>=on[i].s){ acc+=t-on[i].s; } k=i+1; break; } }
    if(!k&&on.length) k=on.length;
    $('#tm').innerHTML='<span class="lb">편집본</span>'+mm(acc)+' <span class="g">/ '+mm(onTotal())+' · 원본 '+mm(t)+'</span>'; $('#pvN').textContent='구간 '+k+' / '+on.length; }
  else $('#tm').innerHTML=hms(t)+' <span class="g">/ '+hms(TOT)+'</span>';
  var ci=cueIdx(t); $('#sub').textContent=ci>=0?D.cues[ci].x:'';
  var r=rowAt(t); if(r!==lastRow){ var o=$('#sl .row.cur'); if(o) o.classList.remove('cur'); var nr=$('#sl .row[data-i="'+r+'"]'); if(nr) nr.classList.add('cur'); lastRow=r; }
  var hi=headAt(t); if(hi!==lastCh||force){ var oc=$('#chs .ch.cur'); if(oc) oc.classList.remove('cur'); var nc=$('#chs .ch[data-i="'+hi+'"]'); if(nc) nc.classList.add('cur');
    var os=$('#slt .sb.cur'); if(os) os.classList.remove('cur'); var ns=$('#slt .sb[data-i="'+hi+'"]'); if(ns) ns.classList.add('cur'); lastCh=hi; }
  if(ci!==lastCue){ var oq=$('#cl .cu.cur'); if(oq) oq.classList.remove('cur'); var nq=$('#cl .cu[data-c="'+ci+'"]'); if(nq){ nq.classList.add('cur'); if(follow&&$('#p-cap').classList.contains('on')) nq.scrollIntoView({block:'nearest'}); } lastCue=ci; }
  if(hi!==lastHead){ var ot=$('#tc .ti.cur'); if(ot) ot.classList.remove('cur'); var nt=$('#tc .ti[data-i="'+hi+'"]'); if(nt){ nt.classList.add('cur'); if($('#p-toc').classList.contains('on')) nt.scrollIntoView({block:'nearest'}); } lastHead=hi; }
}
function loop(){ tick(false); requestAnimationFrame(loop); }

renderToc(); renderLog(); applyDR(); renderAll(); loop();
window.addEventListener('resize',function(){ renderSlt(); tick(true); });
})();
</script>
